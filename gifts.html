<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery gifts</title><link rel="stylesheet" href="style.css"><script src="access.js"></script></head><body><main class="app"><header class="titlebar"><span>Secret</span> Birthday Gift</header><section class="screen gift-screen active"><div class="confetti">✦ • ✧ • ✦ • ✧ • ✦</div><h1>Choose your mystery gift</h1><p>Tap on a box to reveal a surprise 🎁</p><div class="gifts"><button class="gift">♥<b>Gift 1</b></button><button class="gift">♥<b>Gift 2</b></button><button class="gift">♥<b>Gift 3</b></button></div><p id="message" class="message">Three little gifts made with love 💗</p><button id="next" class="primary" hidden>Open memories 📸</button></section><footer>Made with ❤️ for Himanshu</footer></main><script>let opened=0;document.querySelectorAll(".gift").forEach((b,i)=>b.onclick=()=>{if(!b.dataset.open){b.dataset.open=1;b.innerHTML=["🎉","💖","🌟"][i]+"<b>Opened!</b>";opened++;message.textContent=["A lifetime of laughter and memories!","You are truly special 💗","Every dream come true 🌟"][i];if(opened===3)next.hidden=false}});next.onclick=()=>location.href="memories.html";</script></body></html>
