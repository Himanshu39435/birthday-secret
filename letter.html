<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday letter</title><link rel="stylesheet" href="style.css"><script src="access.js"></script></head><body><main class="app"><header class="titlebar"><span>Secret</span> Birthday Gift</header><section class="screen letter-screen active"><div class="letter-picture">🎁</div><div><h1>Happy birthday to my favourite person! ♥</h1><div class="letter" id="letter"></div></div><button class="primary" id="next" hidden onclick="location.href='final-card.html'">Open final card 🎂</button></section><footer>Made with ❤️ for Himanshu</footer></main><script>const text="I hope this year brings you everything you've been wishing for and so much more.Thank you for making my days happier, my bad days easier, and life a little more beautiful just by being in it. 🥹💗 I'm so lucky to have you. Here's to more laughter, crazy memories, and all the happiness you deserve.Happy birthday, my friend. You mean more than you know. 🎁❤️";let i=0;const out=document.querySelector("#letter");(function type(){if(i<text.length){out.textContent+=text[i++];setTimeout(type,25)}else next.hidden=false})()</script></body></html>
