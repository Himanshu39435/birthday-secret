<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Birthday Gift</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="titlebar"><span>Secret</span> Birthday Gift</header>

    <section class="screen midnight-screen active" id="midnightIntro">
      <div class="clock">
        <div class="clock-face"><b>XII</b><b>III</b><b>VI</b><b>IX</b><i class="hour"></i><i class="minute"></i><i class="pin"></i></div>
      </div>
      <div class="countdown"><small>✦ MIDNIGHT COUNTDOWN ✦</small><strong id="countdown">11:59:58</strong><span>Watch the clock strike 12:00:00</span></div>
    </section>

    <footer>Made with ❤️ for Himanshu</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
